name: CI - Build and Push

on:
  push:
    branches: [dev, staging, main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Map branch to environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tag
        id: tag
        run: echo "tag=${{ steps.env.outputs.environment }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/resume-app:${{ steps.tag.outputs.tag }}

      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: MishraPrasum/startbootstrap-manifests
          token: ${{ secrets.MANIFESTS_REPO_PAT }}
          path: manifests

      - name: Update image tag in manifests
        run: |
          cd manifests
          sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/resume-app:${{ steps.tag.outputs.tag }}|" envs/${{ steps.env.outputs.environment }}/deployment.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add envs/${{ steps.env.outputs.environment }}/deployment.yaml
          git commit -m "Update ${{ steps.env.outputs.environment }} image to ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push
